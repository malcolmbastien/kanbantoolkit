<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Flowline — work is a graph, boards are views over it. A board for teams: initiatives roll up from the work below, and every change is part of the record."
    />
    <meta name="theme-color" content="#ffffff" />

    <!-- What a shared link says. It names the product and the idea, never the workspace: boards
         and cards live in the browser, so no crawler can be told one — and a preview that guessed
         would be the leak this is written to avoid. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Flowline" />
    <meta property="og:title" content="Flowline — work is a graph, boards are views over it" />
    <meta
      property="og:description"
      content="A board for teams: initiatives roll up from the work below, and every change is part of the record."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Flowline — work is a graph, boards are views over it" />
    <meta
      name="twitter:description"
      content="A board for teams: initiatives roll up from the work below, and every change is part of the record."
    />

    <title>Flowline</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
