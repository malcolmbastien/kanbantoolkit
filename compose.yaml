# One instance, one container, one volume.
#
#   docker compose up -d
#
# That is the whole install: the image builds from this checkout, the database is created on the
# volume by the first start, and the board answers on http://localhost:8787/app. The first person to
# sign in administers the instance and its one workspace.
#
# Put a reverse proxy in front of it for https (docs/tls.md) and set PUBLIC_URL to that address —
# without it, the session cookie is issued for whatever the request's origin was, and behind a proxy
# that is http.

services:
  kanbantoolkit:
    build: .
    image: kanbantoolkit:local
    restart: unless-stopped

    ports:
      # Loopback only: the proxy is the way in. Change to "8787:8787" to expose it directly on a
      # network you trust, which is a decision, not a default.
      - "127.0.0.1:8787:8787"

    environment:
      # The name of the team. The installation gives it, and it is what a person types to confirm
      # deleting the workspace later.
      WORKSPACE_NAME: ${WORKSPACE_NAME:-Kanban Toolkit}
      # The address the outside world uses: what a sign-in redirect URI is built from, and what
      # makes the session cookie Secure. Set it to your https address.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8787}
      # Mixed into the hash of a reporter's address before it is stored. Set a secret.
      ERROR_SALT: ${ERROR_SALT:-change-me}
      # The development identity: sign in with an address, no provider, no password. Empty means
      # the switch does not exist. **Never set it to 1 on an instance anybody can reach** — it is a
      # door with no lock, and it is here so a local trial needs no OAuth client.
      AUTH_DEV: ${AUTH_DEV:-}
      #
      # The door: the OIDC issuer this team already runs — Google Workspace, Entra, Keycloak,
      # authentik. Optional, and an instance with none still runs (task 154 adds passwords).
      # docs/configure.md has the full list, the defaults, and the redirect URI.
      #
      # AUTH_OIDC_CLIENT_ID: ""
      # AUTH_OIDC_CLIENT_SECRET: ""
      # AUTH_OIDC_AUTHORIZE_ENDPOINT: ""
      # AUTH_OIDC_TOKEN_ENDPOINT: ""
      # AUTH_OIDC_USERINFO_ENDPOINT: ""
      # AUTH_OIDC_LABEL: ""
      #
      # Where this project's own site is, if you want the app's sign-in surface to link its terms
      # and privacy pages. Leave it unset and the app says whose policies apply instead of linking.
      # PROJECT_URL: "https://kanbantoolkit.example"
      #
      # Mail, if you want magic links. A relay on this machine may be plain SMTP; anything else must
      # offer STARTTLS, and a deployment with neither still runs.
      # SMTP_URL: "smtp://user:pass@host:587"
      # MAIL_FROM: "kanbantoolkit@example.com"

    volumes:
      # The database. Removing the container keeps this; removing the volume does not, so a backup
      # of that volume is a backup of the instance (docs/backup.md).
      - kanbantoolkit-data:/data

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

volumes:
  kanbantoolkit-data:
