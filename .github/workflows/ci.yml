name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    # The whole run is under a minute today; a ten-minute ceiling catches a hung step rather than
    # a slow one. The job name is the branch-protection check, so it is deliberately plain.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned to the line the app is developed on (26.12.0 locally) and recorded in the
          # README: a major, because a patch bump is not a decision worth failing a build over.
          node-version: '26'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The hard rule in AGENTS.md, enforced rather than remembered. The script is the single
      # source of truth: the same command a person runs locally.
      - name: Dependency scan
        run: npm run scan

      - name: Build
        run: npm run build
