name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    # The whole run is under a minute today; a ten-minute ceiling catches a hung step rather than
    # a slow one. The job name is what branch protection would require, so it is deliberately plain.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Pinned to the line the app is developed on (26.12.0 locally) and recorded in the
          # README: a major, because a patch bump is not a decision worth failing a build over.
          node-version: '26'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The hard rule in AGENTS.md, enforced rather than remembered. The script is the single
      # source of truth: the same command a person runs locally.
      - name: Dependency scan
        run: npm run scan

      # The other half of the boundary: no Cloudflare binding may appear in the application.
      - name: The portable core is portable
        run: npm run portable

      - name: Build
        run: npm run build

      # The first download, measured from the build's own manifest. A failure prints the size.
      - name: First download size
        run: npm run size

      # The site, checked as a build: every page named, nothing off-origin, the home page inside its
      # budget, and what crawlers are told matching what is served (task 151).
      - name: The site
        run: npm run site:check

      # The docs live with the code, so they are checked like code: every relative link resolves,
      # every file is listed in the index, and every command quoted is one package.json runs
      # (task 167).
      - name: The docs
        run: npm run docs:check

      # The server exists twice — a Worker and a Node process — and two runtimes drift apart
      # silently. This boots the Node entry against a real database and uses the API.
      - name: The Node entry answers
        run: npm run smoke:node

  # The image, built and run for real (task 128): a Dockerfile that is never built is a guess, and
  # a container that starts but cannot reach its database is worse than one that does not start.
  # This builds from the checkout, runs against a fresh volume, signs in through the development
  # door, then replaces the container with the same volume to prove the work outlives it.
  image:
    name: image
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Built as `flowline:local`, the tag compose.yaml expects, so the next steps run the file an
      # operator runs rather than a lookalike.
      - name: Build
        run: docker build -t flowline:local .

      - name: One command, one volume
        run: |
          AUTH_DEV=1 WORKSPACE_NAME="Team Atlas" ERROR_SALT=ci docker compose up -d
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8787/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8787/api/health

      - name: It is not root, and it made its own database
        run: |
          test "$(docker compose exec -T flowline id -u)" = "10001"
          docker compose exec -T flowline test -f /data/flowline.db

      - name: The first sign-in is the workspace
        run: |
          curl -s -c /tmp/jar -X POST http://127.0.0.1:8787/api/auth/dev \
            -H 'content-type: application/json' -d '{"email":"ada@example.com"}' >/dev/null
          curl -s -b /tmp/jar http://127.0.0.1:8787/api/admin/workspace \
            | grep -q '"name":"Team Atlas"'

      - name: The work outlives the container
        run: |
          docker compose down
          AUTH_DEV=1 docker compose up -d
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8787/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -s -b /tmp/jar http://127.0.0.1:8787/api/auth/session | grep -q 'ada@example.com'

      - name: Logs, when something went wrong
        if: failure()
        run: docker compose logs --no-color || true

  # The flows unit tests cannot see: the drag, the drawer, board design and the workspace file,
  # through the built app. It waits on the checks so a broken unit run does not spend two minutes
  # installing a browser to prove it, and publishing waits on this in turn.
  e2e:
    name: e2e
    needs: checks
    runs-on: ubuntu-latest
    # The suite runs in about thirty seconds. The slow part is not the tests: `--with-deps` installs
    # the browser's system packages with apt on every run, whether or not the browser itself was
    # cached, and that has taken nine minutes on a runner. Fifteen is the ceiling for that. If this
    # creeps again, the fix is the Playwright container image, not a longer clock.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      # Keyed on the lockfile, so a Playwright upgrade misses the cache and re-downloads, and
      # nothing else does.
      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end
        run: npm run test:e2e
      # A failed run is only worth having if it can be read: traces, screenshots and video.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-trace
          path: test-results/
          retention-days: 7

  # Publishing lives in this workflow rather than a second one so that it can wait on the checks
  # with `needs`: a green commit publishes, a red one never reaches users, and no pull request is
  # needed to get there. Both deploy jobs skip rather than fail until the Cloudflare account is
  # wired up with the two secrets, so a fresh clone still has a green build.
  deploy:
    name: deploy
    needs: [checks, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `secrets` is not a context a job-level `if` may read, so the credentials are bridged through
    # env and the publish step gates on that. A repository without a Cloudflare account still has
    # a green build: it says what is missing and publishes nothing.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The canonical origin the build writes into every page: canonicals, Open Graph URLs, the
      # sitemap and security.txt. Without it the build uses its placeholder, and a page whose
      # canonical points at somebody else's domain asks to be de-indexed.
      SITE_URL: https://flowline.flowline-team.workers.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
      - name: Nothing to publish yet
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set, so this build was not published."

  preview:
    name: preview
    needs: [checks, e2e]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload a preview version
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload
      - name: Nothing to preview yet
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set, so no preview version was uploaded."
