<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Flowline">
  <rect width="1200" height="630" fill="#faf9f7"/>
  <rect x="0" y="0" width="1200" height="8" fill="#3b4a8c"/>
  <g font-family="Charter, Georgia, serif" fill="#1f2937">
    <text x="80" y="250" font-size="64" font-weight="bold">Work is a graph.</text>
    <text x="80" y="330" font-size="64" font-weight="bold">Boards are views over it.</text>
    <text x="80" y="400" font-size="28" fill="#55657a">A board for teams: initiatives roll up from the work below.</text>
    <text x="80" y="560" font-size="26" fill="#3b4a8c">Flowline</text>
  </g>
</svg>
